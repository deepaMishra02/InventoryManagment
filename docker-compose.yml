services:

  postgres:
    image: postgres:16

    container_name: postgres_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    working_dir: /app
    container_name: flask_backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    command: python app/run.py
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/flaskdb
      PYTHONPATH: /app

    depends_on:
      - postgres

    volumes:
      - ./backend:/app
    restart: always

  frontend:
    build: ./frontend

    container_name: react_frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

    stdin_open: true
    tty: true
    restart: always
    command: npm start 

volumes:
  postgres_data: